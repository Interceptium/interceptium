[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "interceptium"
version = "1.0.0"
description = "Local HTTPS proxy that swaps Roblox game assets on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Single third-party dependency: PyCA cryptography (used only to create the
# local certificate authority). Everything else is the Python standard library.
dependencies = ["cryptography>=42"]

[project.scripts]
interceptium = "interceptium.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
