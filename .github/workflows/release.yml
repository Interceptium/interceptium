name: Build and release

# Tests run on every push. Pushing a tag like v1.0.0 also builds Windows,
# macOS and Linux executables and publishes them as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Interceptium-windows-x64.exe
          - os: macos-latest
            asset: Interceptium-macos.zip
          - os: ubuntu-latest
            asset: Interceptium-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python tools/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/Interceptium.exe "dist/${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Interceptium.app "dist/${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mv dist/Interceptium "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job may create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Interceptium $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
