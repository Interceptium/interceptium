name: Build and release

# Every push: tests on Windows, macOS and Linux, the Windows installer is built
# and checked with a real install + uninstall, and the source archives are made.
# A manual run (Actions > Build and release > Run workflow) also replaces the
# GitHub release for the given version (default v1.0.0) with fresh files.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to (re)publish; an existing release with this tag is deleted first"
        required: false
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: App tests
        run: python -m unittest discover -s tests -v
      - name: Setup tests
        run: python -m unittest discover -s setup/tests -v
      - name: GUI tests (virtual display)
        if: runner.os == 'Linux'
        env:
          INTERCEPTIUM_GUI_TESTS: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a -s "-screen 0 1400x900x24" python -m unittest tests.test_gui -v

  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build (official signed Python runtime + our own C launcher and setup stub, no PyInstaller)
        run: python tools/build_windows.py
      - name: Scan with Microsoft Defender (fails on any detection)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -SignatureUpdate | Out-Host
          Get-MpComputerStatus | Select-Object AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List | Out-Host
          $found = $false
          foreach ($f in @(Get-ChildItem dist\*.exe) + @(Get-Item dist\bundle\Interceptium.exe)) {
            Write-Host "== scanning $($f.Name)"
            $out = & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -eq 2 -or $out -match 'found \d+ threats' -and $out -notmatch 'found no threats') { $found = $true }
          }
          if ($found) { throw 'Microsoft Defender flagged a build' }

      - name: Install, repair and uninstall (the way Windows Settings does)
        shell: pwsh
        timeout-minutes: 12
        env:
          INTERCEPTIUM_TRACE_AFTER: "100"
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $env:INTERCEPTIUM_TRACE = Join-Path $env:RUNNER_TEMP 'trace.log'
          function Show-Log {
            if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "  setup> $_" } }
            if (Test-Path $env:INTERCEPTIUM_TRACE) { Get-Content $env:INTERCEPTIUM_TRACE | ForEach-Object { Write-Host "  trace> $_" } }
          }
          function Run-Exe([string]$exe, [string[]]$arguments, [int]$seconds = 180) {
            # Waits for this process only (not stray children) and never longer than $seconds.
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($seconds * 1000)) { Show-Log; Stop-Process -Id $p.Id -Force; throw "$exe timed out" }
            return $p.ExitCode
          }
          function Wait-Until([scriptblock]$done, [string]$what, [int]$seconds = 180) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while (-not (& $done)) {
              if ((Get-Date) -gt $deadline) { Show-Log; throw "timed out waiting for $what" }
              Start-Sleep -Seconds 2
            }
          }
          $setup = (Get-ChildItem dist\Interceptium-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Interceptium'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Interceptium'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Interceptium.lnk'

          Write-Host '== built app starts (before installing)'
          $code = Run-Exe (Resolve-Path dist\bundle\Interceptium.exe).Path @('--version') 150
          Show-Log
          if ($code -ne 0) { throw "app exited with $code" }

          Write-Host '== install'
          $code = Run-Exe $setup @('--quiet', '--dir', "`"$dir`"", '--log', "`"$log`"")
          Show-Log
          if ($code -ne 0) { throw "install exited with $code" }
          foreach ($f in 'Interceptium.exe', 'Interceptium Setup.exe', 'install.json') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $entry = Get-ItemProperty $key
          if ($entry.InstallLocation -ne $dir) { throw "wrong InstallLocation: $($entry.InstallLocation)" }
          if ($entry.DisplayName -ne 'Interceptium') { throw 'wrong DisplayName' }
          if (-not (Test-Path $lnk)) { throw 'Start menu shortcut missing' }

          Write-Host '== app starts'
          $code = Run-Exe (Join-Path $dir 'Interceptium.exe') @('--version') 60
          if ($code -ne 0) { throw "app exited with $code" }

          Write-Host '== repair'
          Remove-Item (Join-Path $dir 'Interceptium.exe')
          Remove-Item $log -ErrorAction SilentlyContinue
          $code = Run-Exe (Join-Path $dir 'Interceptium Setup.exe') @('--repair', '--quiet', '--log', "`"$log`"")
          if ($code -ne 0) { Show-Log; throw "repair launcher exited with $code" }
          Wait-Until { (Test-Path $log) -and ((Get-Content $log -Raw) -match 'finished|failed|Traceback') } 'repair'
          Show-Log
          if ((Get-Content $log -Raw) -notmatch 'finished') { throw 'repair failed' }
          if (-not (Test-Path (Join-Path $dir 'Interceptium.exe'))) { throw 'repair did not restore the app' }

          Write-Host '== uninstall (QuietUninstallString from the Apps entry)'
          $entry = Get-ItemProperty $key
          if ($entry.QuietUninstallString -notmatch '^"([^"]+)"\s*(.*)$') { throw "odd uninstall string: $($entry.QuietUninstallString)" }
          $exe, $rest = $Matches[1], $Matches[2]
          Remove-Item $log -ErrorAction SilentlyContinue
          $code = Run-Exe $exe @(($rest -split ' ') + @('--log', "`"$log`""))
          if ($code -ne 0) { Show-Log; throw "uninstall launcher exited with $code" }
          Wait-Until { -not ((Test-Path $dir) -or (Test-Path $key) -or (Test-Path $lnk)) } 'uninstall'
          Show-Log
          Write-Host 'Install, repair and uninstall all worked.'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/Interceptium-Setup-*.exe
          if-no-files-found: error

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Make source archives
        run: python tools/package_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [windows-setup, sources]  # tests already run on every push; no need to wait for a free Mac
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job may change releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "bad version: $VERSION"; exit 1 ;; esac
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" 2>/dev/null || true
          gh release create "$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Interceptium $VERSION" \
            --notes-file RELEASE_NOTES.md
