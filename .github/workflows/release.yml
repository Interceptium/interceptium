name: Build and release

# Every push: tests on Windows, macOS and Linux, the window is opened on Linux under a
# virtual display, the Windows exe is built and checked with a real install, repair and
# uninstall, and the source archives are made.
# A manual run (Actions > Build and release > Run workflow) also replaces the GitHub
# release for the given version (default v1.0.0).
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to (re)publish; an existing release with this tag is deleted first"
        required: false
        default: "v1.0.0"
      reuse_run:
        description: "Optional: publish the exact files built (and scanned) by this earlier run ID instead of rebuilding"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Tests
        run: cargo test --locked
      - name: Open the window under a virtual display and take a screenshot
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libxkbcommon-x11-0 libgl1-mesa-dri
          cargo build --release --locked --features shots
          export INTERCEPTIUM_HOME="$RUNNER_TEMP/home" INTERCEPTIUM_RENDERER=glow
          for scene in main rule settings0; do
            INTERCEPTIUM_SHOT="$RUNNER_TEMP/$scene.png" INTERCEPTIUM_SHOT_SCENE=$scene \
              timeout 120 xvfb-run -a -s "-screen 0 1400x900x24" ./target/release/interceptium
            test -s "$RUNNER_TEMP/$scene.png"
          done

  windows-setup:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_run == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build
        shell: pwsh
        run: |
          cargo build --release --locked
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\interceptium.exe "dist\Interceptium-Setup-$version.exe"
          Get-Item dist\*.exe | Format-Table Name, Length

      - name: Scan with Microsoft Defender (fails on any detection)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -SignatureUpdate | Out-Host
          $found = $false
          foreach ($f in Get-ChildItem dist\*.exe) {
            Write-Host "== scanning $($f.Name)"
            $out = & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -eq 2 -or $out -match 'found \d+ threats' -and $out -notmatch 'found no threats') { $found = $true }
          }
          if ($found) { throw 'Microsoft Defender flagged a build' }

      - name: Install, open, repair and uninstall (the way Windows Settings does)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $env:INTERCEPTIUM_HOME = Join-Path $env:RUNNER_TEMP 'home'
          function Show-Log { if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "  setup> $_" } } }
          function Run-Exe([string]$exe, [string[]]$arguments, [int]$seconds = 120) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $p.WaitForExit($seconds * 1000)) { Show-Log; Stop-Process -Id $p.Id -Force; throw "$exe timed out" }
            return $p.ExitCode
          }
          $setup = (Get-ChildItem dist\Interceptium-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Interceptium'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Interceptium'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Interceptium.lnk'

          Write-Host '== version'
          if ((Run-Exe $setup @('--version')) -ne 0) { throw 'version failed' }

          Write-Host '== install'
          $code = Run-Exe $setup @('--install', '--quiet', '--dir', "`"$dir`"", '--log', "`"$log`"")
          Show-Log
          if ($code -ne 0) { throw "install exited with $code" }
          foreach ($f in 'Interceptium.exe', 'install.json') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $entry = Get-ItemProperty $key
          if ($entry.InstallLocation -ne $dir) { throw "wrong InstallLocation: $($entry.InstallLocation)" }
          if ($entry.DisplayName -ne 'Interceptium') { throw 'wrong DisplayName' }
          if (-not (Test-Path $lnk)) { throw 'Start menu shortcut missing' }

          Write-Host '== the installed app opens its window and keeps running'
          $app = Start-Process -FilePath (Join-Path $dir 'Interceptium.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "app exited early with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2

          Write-Host '== repair'
          Remove-Item $lnk
          Remove-Item $log -ErrorAction SilentlyContinue
          $code = Run-Exe $setup @('--repair', '--quiet', '--log', "`"$log`"")
          Show-Log
          if ($code -ne 0) { throw "repair exited with $code" }
          if (-not (Test-Path $lnk)) { throw 'repair did not restore the shortcut' }

          Write-Host '== uninstall (QuietUninstallString from the Apps entry)'
          $entry = Get-ItemProperty $key
          if ($entry.QuietUninstallString -notmatch '^"([^"]+)"\s*(.*)$') { throw "odd uninstall string: $($entry.QuietUninstallString)" }
          $exe, $rest = $Matches[1], $Matches[2]
          Remove-Item $log -ErrorAction SilentlyContinue
          $code = Run-Exe $exe @(($rest -split ' ') + @('--log', "`"$log`""))
          Show-Log
          if ($code -ne 0) { throw "uninstall exited with $code" }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Out-Host; throw 'install folder still there' }
          if (Test-Path $key) { throw 'Apps entry still there' }
          if (Test-Path $lnk) { throw 'shortcut still there' }
          Write-Host 'Install, repair and uninstall all worked.'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/Interceptium-Setup-*.exe
          if-no-files-found: error

  sources:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make source archives
        run: sh scripts/package-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.version != '' &&
      (inputs.reuse_run != '' || (needs.windows-setup.result == 'success' && needs.sources.result == 'success'))
    needs: [windows-setup, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job may change releases
      actions: read    # to fetch files from an earlier run when reuse_run is set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: out
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: out
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "bad version: $VERSION"; exit 1 ;; esac
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" 2>/dev/null || true
          gh release create "$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Interceptium $VERSION" \
            --notes-file RELEASE_NOTES.md
